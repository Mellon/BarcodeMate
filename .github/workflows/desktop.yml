name: Desktop validation and packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:app
      - name: Package macOS for local review
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Package Windows for local review
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BarcodeMate-${{ runner.os }}-review
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            test-results/
          if-no-files-found: ignore
# This workflow validates and builds artifacts only; it never publishes a release.
