name: Desktop validation and packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:app
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Install and test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/BarcodeMate-*-win-x64.exe | Select-Object -First 1
          if (!$installer) { throw 'Windows installer missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'BarcodeMate-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:BARCODEMATE_EXECUTABLE = Join-Path $installDir 'BarcodeMate.exe'
          if (!(Test-Path $env:BARCODEMATE_EXECUTABLE)) { throw 'Installed executable missing' }
          npm run test:app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and test macOS package
        if: runner.os == 'macOS'
        run: |
          ARCH=$(node -p 'process.arch')
          ditto -x -k "release/BarcodeMate-0.1.0-mac-$ARCH.zip" "$RUNNER_TEMP/BarcodeMate-installed"
          BARCODEMATE_EXECUTABLE="$RUNNER_TEMP/BarcodeMate-installed/BarcodeMate.app/Contents/MacOS/BarcodeMate" npm run test:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BarcodeMate-${{ runner.os }}-review
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            test-results/
          if-no-files-found: ignore
# This workflow validates and builds artifacts only; it never publishes a release.
